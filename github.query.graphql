query ListTags($owner: String!, $repo: String!, $after: String) {
  repository(owner: $owner, name: $repo) {
    refs(
      refPrefix: "refs/tags/"
      orderBy: { field: TAG_COMMIT_DATE, direction: DESC }
      first: 100
      after: $after
    ) {
      nodes {
        name
        target {
          __typename
          oid
          ... on Commit {
            __typename
            committedDate
          }
          ... on Tag {
            target {
              __typename
              oid
              ... on Commit {
                __typename
                committedDate
              }
            }
          }
        }
      }
      pageInfo {
        endCursor
        hasNextPage
      }
    }
  }
}
query RefInfo($owner: String!, $repo: String!, $qTag: String!) {
  repository(owner: $owner, name: $repo) {
    ref(qualifiedName: $qTag) {
      name
      target {
        __typename
        oid
        ... on Commit {
            __typename
            committedDate
        }
        ... on Tag {
          target {
            __typename
            oid
            ... on Commit {
                __typename
                committedDate
            }
          }
        }
      }
    }
  }
}

query ObjInfo($owner: String!, $repo: String!, $oid: GitObjectID!) {
  repository(owner: $owner, name: $repo) {
    object(oid: $oid) {
      __typename
      ... on Commit {
        committedDate
      }
    }
  }
}

query ListReleases($owner: String!, $repo: String!, $after: String) {
  repository(owner: $owner, name: $repo) {
    releases(
      orderBy: { direction: DESC, field: CREATED_AT }
      first: 100
      after: $after
    ) {
      nodes {
        name
        isPrerelease
        tag {
          name
        }
        tagCommit {
          oid
          committedDate
        }
      }
      pageInfo {
        endCursor
        hasNextPage
      }
    }
  }
}

query DefaultBranch($owner: String!, $repo: String!) {
  repository(owner: $owner, name: $repo) {
    defaultBranchRef {
      name
      target {
        __typename
        oid
        ... on Commit {
            committedDate
        }
      }
    }
  }
}
