query ListTags($owner: String!, $repo: String!, $after: String) {
  repository(owner: $owner, name: $repo) {
    refs(
      refPrefix: "refs/tags/"
      orderBy: {field: TAG_COMMIT_DATE, direction: DESC}
      first: 100
      after: $after
    ) {
      nodes {
        name
        target {
          __typename
          oid
          ...on Tag {
            target {
              __typename
              oid
            }
          }
        }
      }
      pageInfo {
        endCursor
        hasNextPage
      }
    }
  }
}
query TagInfo($owner: String!, $repo: String!, $qTag: String!) {
  repository(owner: $owner, name: $repo) {
    ref(qualifiedName: $qTag) {
      name
      target {
        __typename
        oid
        ...on Tag {
          target {
            __typename
            oid
          }
        }
      }
    }
  }
}
